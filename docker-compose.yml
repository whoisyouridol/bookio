services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Do NOT expose port 5432 to host in production —
    # only the api container needs it via internal network.
    # Uncomment below for local debugging only:
    ports:
      - "5433:5432"

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend_net
    ports:
      - "9001:9001"   # MinIO web console (remove in production if not needed)
    # Port 9000 is NOT exposed to host — only the api container needs it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO bucket init (runs once, then exits) ─────────────────────────────
  minio-init:
    image: minio/mc:latest
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set download local/${MINIO_BUCKET} &&
        echo 'Bucket ready.'
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET}

  # ── pgAdmin ───────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  # ── Backend (.NET API) ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/BeautySalonBooking.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:8080

      # PostgreSQL — use service name "db", internal port 5432
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      # MinIO — use service name "minio", internal port 9000
      MinIO__Endpoint:      minio:9000
      MinIO__PublicEndpoint: http://localhost:9000
      MinIO__AccessKey:     ${MINIO_ROOT_USER}
      MinIO__SecretKey:     ${MINIO_ROOT_PASSWORD}
      MinIO__BucketName:    ${MINIO_BUCKET}

      # JWT
      Jwt__Secret:                      ${JWT_SECRET}
      Jwt__Issuer:                      ${JWT_ISSUER}
      Jwt__Audience:                    ${JWT_AUDIENCE}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}

      # SMTP
      Smtp__Host:        ${SMTP_HOST}
      Smtp__Port:        ${SMTP_PORT}
      Smtp__UseSsl:      ${SMTP_USE_SSL}
      Smtp__Username:    ${SMTP_USERNAME}
      Smtp__Password:    ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName:    ${SMTP_FROM_NAME}

      # OAuth
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID}

      # Subdomain cookie domain
      Subdomain__MainDomains__0: localhost
      Subdomain__MainDomains__1: bookvisit.com

    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Port 8080 is NOT exposed to host — nginx proxies /api/* to it
    # Uncomment below for local debugging only:
    # ports:
    #   - "8080:8080"

  # ── Frontend (React → nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked into the JS bundle at build time
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID}
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP
      - "443:443"   # HTTPS (configure SSL via reverse proxy or certbot)
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend_net:
    # Internal only — db, minio, api communicate here; not accessible from host
    driver: bridge
    internal: false   # set to true in production if api has no outbound needs
  frontend_net:
    # frontend nginx ↔ api communication
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
