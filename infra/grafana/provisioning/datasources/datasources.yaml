apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceId
          datasourceUid: tempo
          matcherRegex: '"?TraceId"?\s*[:=]\s*"?(\w{32})"?'
          url: "$${__value.raw}"
          matcherType: regex

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
